let paceRadioLoaded=false;
function openRadio(){
 document.getElementById('detail').classList.add('hidden');
 document.getElementById('home').classList.add('hidden');
 document.getElementById('radio-screen').classList.remove('hidden');
 if(!paceRadioLoaded){
   const binary=atob(PACE_RADIO_B64);
   const bytes=Uint8Array.from(binary,c=>c.charCodeAt(0));
   document.getElementById('radio-frame').srcdoc=new TextDecoder().decode(bytes);
   paceRadioLoaded=true;
 }
 window.scrollTo(0,0);
}
function closeRadio(){
 document.getElementById('radio-screen').classList.add('hidden');
 document.getElementById('home').classList.remove('hidden');
}
</script></body></html>
